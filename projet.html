<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // A browser reload lands on the Home (and its loader), not back on this
      // page. Runs before anything else renders.
      (function () {
        var reload = false;
        try {
          var n = performance.getEntriesByType("navigation")[0];
          reload = n ? n.type === "reload" : performance.navigation.type === 1;
        } catch (e) {}
        if (reload) location.replace("index.html");
      })();
    </script>
    <title>Léa Nemeth</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="projet.css" />
  </head>
  <body>
    <!-- Same nav as the home: fixed left column (desktop) / top bar + slide-down
         menu (mobile). The project list is built by nav.js from
         assets/projects-data.js — keep this markup in sync with index.html. -->
    <nav class="site-nav" aria-label="Menu principal">
      <div class="site-nav__group">
        <div class="site-nav__bar">
          <p class="site-nav__name"><a href="index.html#home">Léa Nemeth</a></p>
          <button class="site-nav__toggle" type="button" aria-expanded="false">Menu</button>
        </div>
        <ul class="site-nav__list site-nav__list--projects"></ul>
      </div>

      <ul class="site-nav__list site-nav__list--meta">
        <li><a href="https://www.instagram.com/laitfraiise/" target="_blank" rel="noopener">Instagram</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>

    <main class="project">
      <!-- Desktop-only image display: a continuous filmstrip (like the home
           carousel) — the current image, its left/right neighbours and,
           fleetingly, whatever's mid-transition all live here as one system.
           No scroll/auto-drift — only moves when you navigate. Built by
           projet.js (buildTrack()/renderTrack()). -->
      <div class="project__track" aria-hidden="true"></div>

      <section class="project__stage">
        <!-- mobile-only image display now (see projet.css) — the desktop
             track above replaces it there entirely -->
        <div class="project__viewport" aria-live="polite"></div>
      </section>

      <aside class="project__info">
        <h1 class="project__title"></h1>
        <div class="project__desc"></div>
        <p class="project__meta">
          <span class="project__meta-technique"></span>
          <span class="project__meta-year"></span>
        </p>
      </aside>

      <div class="project__thumbs" role="tablist" aria-label="Images du projet"></div>

      <!-- prev/next: bottom-right, on the "Next project" line, left edge
           aligned with the thumbnail strip's first thumbnail (projet.js's
           positionArrows() sets the exact left). Hidden on mobile — tapping
           thumbnails + "Next project" replace them there.
           ‹ › (angle quotes) rather than →/← — Cormorant Garamond has no
           arrow glyphs, so those fall back to a mismatched system font. -->
      <div class="project__arrows">
        <button class="project__arrow" type="button" data-dir="-1" aria-label="Image précédente">&lsaquo;</button>
        <button class="project__arrow" type="button" data-dir="1" aria-label="Image suivante">&rsaquo;</button>
      </div>

      <!-- mobile only (see projet.css) -->
      <a class="project__next" href="projet.html">Next project</a>
    </main>

    <script src="assets/projects-data.js"></script>
    <script src="nav.js"></script>
    <script src="projet.js"></script>
    <script src="cursor.js"></script>
  </body>
</html>
